apiVersion: apps/v1
kind: Deployment

metadata:
  name: axion-pgadmin
  namespace: axion-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: axion-pgadmin

  template:
    metadata:
      labels:
        app: axion-pgadmin

    spec:
      containers:
        - name: axion-pgadmin
          image: dpage/pgadmin4:latest

          ports:
            - containerPort: 80

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "jaydeep.chakraborty1985@gmail.com"

            - name: PGADMIN_DEFAULT_PASSWORD
              value: "Admin@123"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"